<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DopsMind Labs</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f1a;
      color: white;
    }

    section {
      padding: 80px 20px;
      text-align: center;
    }

    h2 {
      margin-bottom: 40px;
    }

    /* ===== STACK SECTION ===== */
    .logo-marquee {
      overflow: hidden;
      width: 100%;
      position: relative;
    }

    .logo-track {
      display: flex;
      gap: 60px;
      width: max-content;
      animation: scrollLogos 25s linear infinite;
      align-items: center;
    }

    .logo-track img {
      height: 50px;
      width: auto;
      opacity: 0.8;
      filter: grayscale(100%);
      transition: 0.3s;
    }

    .logo-track img:hover {
      opacity: 1;
      filter: grayscale(0%);
      transform: scale(1.1);
    }

    @keyframes scrollLogos {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }

  </style>
</head>

<body>

  <!-- STACK SECTION (UPDATED ONLY THIS PART) -->
  <section id="stack">
    <h2>Trusted Stacks & Platforms</h2>

    <div class="logo-marquee">
      <div class="logo-track">

        <!-- Logos -->
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/amazonwebservices/amazonwebservices-original.svg">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/kubernetes/kubernetes-plain.svg">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/docker/docker-original.svg">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/terraform/terraform-original.svg">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/googlecloud/googlecloud-original.svg">

        <!-- AI / Modern -->
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/openai.svg">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/langchain.svg">

        <!-- DUPLICATE (for smooth infinite loop) -->
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/amazonwebservices/amazonwebservices-original.svg">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/kubernetes/kubernetes-plain.svg">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/docker/docker-original.svg">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/terraform/terraform-original.svg">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/googlecloud/googlecloud-original.svg">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/openai.svg">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/langchain.svg">

      </div>
    </div>
  </section>

</body>
</html>
